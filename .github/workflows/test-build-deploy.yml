name: Test, Build and Deploy

# Deploys to AWS account (ap-south-1).
# GitHub Secrets required:
#   AWS_ROLE_ARN        - from CloudFormation output GitHubActionsRoleARN
#   EC2_INSTANCE_ID     - from CloudFormation output EC2InstanceId
#   PROD_DATABASE_URL   - PostgreSQL URL for DB migrations
#   SENDGRID_API_KEY    - SendGrid email API key
#   GOOGLE_CALENDAR_CLIENT_ID
#   GOOGLE_CALENDAR_CLIENT_SECRET
#   GOOGLE_CALENDAR_REFRESH_TOKEN
#   GOOGLE_CALENDAR_ID
#   RAZORPAY_KEY_ID
#   RAZORPAY_KEY_SECRET
#   RAZORPAY_WEBHOOK_SECRET
#   OPENAI_API_KEY

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "011266921462"
  ECR_REPOSITORY: startupvarsity-portal
  IMAGE_TAG: latest
  APP_URL: https://www.startupvarsity.com
  APEX_URL: https://startupvarsity.com

jobs:
  # ============================================================
  # Job 1: Run Tests
  # Fails immediately if lint or any test fails
  # ============================================================
  test:
    name: "1. Run Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run lint

      - name: Run backend tests
        run: |
          if [ $(find server -name "*.test.ts" -type f | wc -l) -gt 0 ]; then
            echo "✅ Found backend test files, running tests..."
            npm run test:backend
          else
            echo "⚠️  No backend test files found, skipping"
          fi

      - name: Run frontend tests
        run: |
          if [ $(find client -name "*.test.ts" -o -name "*.test.tsx" -type f | wc -l) -gt 0 ]; then
            echo "✅ Found frontend test files, running tests..."
            npm run test:frontend
          else
            echo "⚠️  No frontend test files found, skipping"
          fi

  # ============================================================
  # Job 2: Build
  # Builds npm dist + Docker image (no ECR push yet)
  # Saves Docker image as artifact for scan + deploy jobs
  # ============================================================
  build:
    name: "2. Build"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.cjs" ]; then
            echo "❌ Build failed - dist/index.cjs not found"
            exit 1
          fi
          echo "✅ Build output verified: dist/index.cjs exists"

      - name: Build Docker image
        run: |
          # BUILD_SHA is surfaced at /health so the deploy can be verified.
          # Tagged with the commit as well as :latest — :latest alone makes "which code is
          # live" unanswerable, and lets a stale local image masquerade as a fresh deploy.
          docker build -f Dockerfile.aws \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          echo "✅ Docker image built successfully"

      - name: Save Docker image as tar
        run: |
          docker save ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ${{ env.ECR_REPOSITORY }}:${{ github.sha }} | gzip > image.tar.gz
          echo "✅ Docker image saved ($(du -sh image.tar.gz | cut -f1))"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ============================================================
  # Job 3: Vulnerability Scan
  # Scans Docker image BEFORE it reaches production
  # Fails pipeline on CRITICAL severity CVEs
  # ============================================================
  vulnerability-scan:
    name: "3. Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < image.tar.gz
          echo "✅ Docker image loaded"

      - name: Checkout code (for .trivyignore)
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          severity: CRITICAL
          vuln-type: os,library

      - name: Upload scan report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-report.sarif
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: os,library

      - name: Upload Trivy report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-report.sarif
          retention-days: 7

  # ============================================================
  # Job 4: Deploy
  # Pushes clean image to ECR → updates secrets → SSM deploy → DB migrations
  # Only runs after vulnerability scan passes
  # ============================================================
  deploy:
    name: "4. Deploy to EC2"
    runs-on: ubuntu-latest
    needs: vulnerability-scan
    permissions:
      id-token: write
      contents: read

    steps:
      # Needed to ship infrastructure/aws/deploy.sh to the instance.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "✅ AWS Account: $AWS_ACCOUNT_ID"
          if [ "$AWS_ACCOUNT_ID" != "${{ env.AWS_ACCOUNT_ID }}" ]; then
            echo "❌ Wrong AWS account. Expected ${{ env.AWS_ACCOUNT_ID }}, got $AWS_ACCOUNT_ID"
            exit 1
          fi

      - name: Update secrets in Secrets Manager
        run: |
          APP_NAME="startupvarsity-portal"
          REGION="${{ env.AWS_REGION }}"

          update_secret() {
            local NAME=$1
            local VALUE=$2
            local DESC=$3
            if [ -z "$VALUE" ]; then
              echo "⚠️  $NAME not set in GitHub secrets. Skipping."
              return
            fi
            VAL=$(echo "$VALUE" | tr -d '\n\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$VAL" ] && return
            SECRET_ID="${APP_NAME}/${NAME}"
            if aws secretsmanager describe-secret --secret-id "$SECRET_ID" --region "$REGION" 2>/dev/null; then
              aws secretsmanager put-secret-value --secret-id "$SECRET_ID" --secret-string "$VAL" --region "$REGION"
              echo "✅ ${NAME} updated"
            else
              aws secretsmanager create-secret --name "$SECRET_ID" --description "$DESC" --secret-string "$VAL" --region "$REGION"
              echo "✅ ${NAME} created"
            fi
          }

          update_secret "SENDGRID_API_KEY"              "${{ secrets.SENDGRID_API_KEY }}"              "SendGrid API key"
          update_secret "GOOGLE_CALENDAR_CLIENT_ID"     "${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}"     "Google OAuth2 Client ID"
          update_secret "GOOGLE_CALENDAR_CLIENT_SECRET" "${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" "Google OAuth2 Client Secret"
          update_secret "GOOGLE_CALENDAR_REFRESH_TOKEN" "${{ secrets.GOOGLE_CALENDAR_REFRESH_TOKEN }}" "Google OAuth2 Refresh Token"
          update_secret "GOOGLE_CALENDAR_ID"            "${{ secrets.GOOGLE_CALENDAR_ID }}"            "Google Calendar ID"
          update_secret "RAZORPAY_KEY_ID"               "${{ secrets.RAZORPAY_KEY_ID }}"               "Razorpay Live Key ID"
          update_secret "RAZORPAY_KEY_SECRET"           "${{ secrets.RAZORPAY_KEY_SECRET }}"           "Razorpay Live Key Secret"
          update_secret "RAZORPAY_WEBHOOK_SECRET"       "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}"       "Razorpay Webhook Secret"
          update_secret "OPENAI_API_KEY"                "${{ secrets.OPENAI_API_KEY }}"                "OpenAI API Key"
          update_secret "PAYMENT_PORTAL_URL"           "${{ secrets.PAYMENT_PORTAL_URL }}"           "Payment portal URL (Razorpay whitelisted domain)"
          update_secret "PORTAL_URL"                   "${{ secrets.PORTAL_URL }}"                   "Main portal URL for email links"

          echo "✅ All secrets updated"

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load and push Docker image to ECR
        run: |
          docker load < image.tar.gz
          echo "✅ Docker image loaded"

          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

          ECR_BASE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}"

          docker tag ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} "$ECR_BASE:${{ env.IMAGE_TAG }}"
          docker tag ${{ env.ECR_REPOSITORY }}:${{ github.sha }} "$ECR_BASE:${{ github.sha }}"

          # Commit tag first: if the :latest push then fails, the instance can still be
          # pointed at an image that definitely exists.
          docker push "$ECR_BASE:${{ github.sha }}"
          docker push "$ECR_BASE:${{ env.IMAGE_TAG }}"
          echo "✅ Images pushed: $ECR_BASE:{${{ github.sha }},${{ env.IMAGE_TAG }}}"

      - name: Deploy to EC2 via SSM
        run: |
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          if [ -z "$INSTANCE_ID" ]; then
            echo "⚠️  EC2_INSTANCE_ID not set. Looking up instance by tag..."
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=startupvarsity-portal" \
                "Name=instance-state-name,Values=running" \
              --query 'Reservations[0].Instances[0].InstanceId' \
              --output text \
              --region ${{ env.AWS_REGION }})
            echo "Found instance: $INSTANCE_ID"
          fi

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "❌ Could not find EC2 instance. Set EC2_INSTANCE_ID in GitHub secrets."
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV
          echo "🚀 Deploying to EC2: $INSTANCE_ID"

          # Ship the repo's deploy script, then run it. The script used to live only on
          # the instance, written once at provisioning time, and had drifted from every
          # copy in the repo — so fixing the repo changed nothing on the box. Uploading it
          # each time makes infrastructure/aws/deploy.sh the single source of truth.
          DEPLOY_B64=$(base64 -w0 infrastructure/aws/deploy.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["mkdir -p /opt/startupvarsity","echo $DEPLOY_B64 | base64 -d > /opt/startupvarsity/deploy.sh","chmod +x /opt/startupvarsity/deploy.sh","/opt/startupvarsity/deploy.sh ${{ github.sha }}"] \
            --comment "GitHub Actions deploy - ${{ github.sha }}" \
            --region ${{ env.AWS_REGION }} \
            --query 'Command.CommandId' \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deploy to complete
        run: |
          echo "⏳ Waiting for deploy to complete..."
          TIMEOUT=600
          INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "  [$ELAPSED/${TIMEOUT}s] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deploy completed successfully!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardOutputContent' \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deploy failed with status: $STATUS"
              # stdout as well as stderr. deploy.sh says why it stopped — which disk
              # check tripped, which image would not pull — on stdout, and printing
              # stderr alone reported "failed to run commands: exit status 1" and
              # nothing else, so the 13 Aug 2026 failure had to be diagnosed by hand.
              echo "--- deploy output ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardOutputContent' \
                --output text
              echo "--- stderr ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ Deploy timed out after ${TIMEOUT}s"
            exit 1
          fi

      - name: Run DB migrations via SSM
        run: |
          echo "🔄 Running DB migrations on EC2..."

          # Explicit migrations run BEFORE db:push, deliberately:
          #  - db:push only syncs SCHEMA. It never inserts data, so a table that
          #    needs seed rows (tracks) would be created empty and the app would
          #    reject every value as unknown.
          #  - db:push has no --force here, and it prompts on data-loss
          #    statements. Under `docker exec` there is no TTY, so a change like
          #    the track enum -> text conversion would hang until the 300s
          #    timeout. Applying it explicitly first leaves push with nothing
          #    destructive to infer.
          # All three are idempotent and safe to re-run on every deploy.

          MIGRATION_CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["docker exec startupvarsity-portal sh -c \"npm run db:ensure-production-tables && npm run db:add-tickets && npm run db:add-team-chat && npm run db:add-tracks && npm run db:add-sprint-name && npm run db:add-meeting-recordings && npm run db:add-meeting-platform && npm run db:push\""]}' \
            --comment "DB migration - ${{ github.sha }}" \
            --region ${{ env.AWS_REGION }} \
            --query 'Command.CommandId' \
            --output text)

          echo "Migration Command ID: $MIGRATION_CMD_ID"
          echo "⏳ Waiting for migration..."

          TIMEOUT=300
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$MIGRATION_CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            echo "  [${ELAPSED}s] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Migrations completed!"
              aws ssm get-command-invocation \
                --command-id "$MIGRATION_CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardOutputContent' --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Migration failed:"
              aws ssm get-command-invocation \
                --command-id "$MIGRATION_CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardErrorContent' --output text
              exit 1
            fi

            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

  # ============================================================
  # Job 5: Smoke Tests
  # Verifies the deployed app is healthy and responding
  # Runs against production after every successful deploy
  # ============================================================
  smoke-test:
    name: "5. Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Verify production is running THIS commit
        run: |
          # The gate that was missing. Every job can go green while the old container keeps
          # serving: on 6 Aug 2026 a deploy reported success and production carried on
          # serving the previous client bundle, which only came to light because someone
          # noticed a new form field was absent. "HTTP 200" cannot tell those apart —
          # the old build answers 200 perfectly well. So assert the running build IS the
          # commit just deployed, and fail the workflow if it is not.
          EXPECTED="${{ github.sha }}"
          echo "🔍 Expecting buildSha=$EXPECTED at ${{ env.APP_URL }}/health"

          DEADLINE=$((SECONDS + 240))
          ACTUAL=""
          while [ $SECONDS -lt $DEADLINE ]; do
            ACTUAL=$(curl -s --max-time 10 "${{ env.APP_URL }}/health" \
              | sed -n 's/.*"buildSha":"\([^"]*\)".*/\1/p')
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "✅ Production is serving $EXPECTED"
              exit 0
            fi
            echo "   still reporting '${ACTUAL:-<none>}' — retrying in 15s"
            sleep 15
          done

          echo "❌ Production never reported this commit."
          echo "   expected: $EXPECTED"
          echo "   actual:   ${ACTUAL:-<no buildSha in /health>}"
          echo ""
          echo "The image was pushed but the running container is not it. Check on the instance:"
          echo "  docker inspect -f '{{.Config.Image}}' startupvarsity-portal"
          echo "  tail -50 /var/log/startupvarsity/deploy.log"
          echo "A blank buildSha means the container predates this change and needs one deploy"
          echo "with the new image before this check can pass."
          exit 1

      - name: Check HTTP → HTTPS redirect
        run: |
          echo "🔍 Checking HTTP → HTTPS redirect (www)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://www.startupvarsity.com)
          if [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "✅ www redirect working (HTTP $STATUS)"
          else
            echo "❌ Expected 301/302 redirect on www, got HTTP $STATUS"
            exit 1
          fi

          echo "🔍 Checking HTTP → HTTPS redirect (root domain)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://startupvarsity.com || echo "000")
          if [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "✅ Root domain redirect working (HTTP $STATUS)"
          else
            echo "⚠️  Root domain redirect not yet configured (HTTP $STATUS) — add A record in GoDaddy to fix"
          fi

      - name: Check app health endpoint
        run: |
          echo "🔍 Checking ${{ env.APP_URL }}/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 ${{ env.APP_URL }}/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ ${{ env.APP_URL }}/health passed (HTTP $STATUS)"
          else
            echo "❌ ${{ env.APP_URL }}/health failed (HTTP $STATUS)"
            exit 1
          fi
          echo "🔍 Checking ${{ env.APEX_URL }}/health (non-fatal until DNS is configured)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 ${{ env.APEX_URL }}/health || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ ${{ env.APEX_URL }}/health passed (HTTP $STATUS)"
          else
            echo "⚠️  ${{ env.APEX_URL }}/health not reachable (HTTP $STATUS) — add A record in GoDaddy to fix"
          fi

      - name: Check app loads
        run: |
          echo "🔍 Checking ${{ env.APP_URL }}/app ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 ${{ env.APP_URL }}/app)
          if [ "$STATUS" = "200" ]; then
            echo "✅ ${{ env.APP_URL }}/app loaded (HTTP $STATUS)"
          else
            echo "❌ ${{ env.APP_URL }}/app failed (HTTP $STATUS)"
            exit 1
          fi
          echo "🔍 Checking ${{ env.APEX_URL }}/app (non-fatal until DNS is configured)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 ${{ env.APEX_URL }}/app || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ ${{ env.APEX_URL }}/app loaded (HTTP $STATUS)"
          else
            echo "⚠️  ${{ env.APEX_URL }}/app not reachable (HTTP $STATUS) — add A record in GoDaddy to fix"
          fi

      - name: Check bot API health
        run: |
          echo "🔍 Checking bot /health endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 ${{ env.APP_URL }}/bot/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Bot health check passed (HTTP $STATUS)"
          else
            echo "⚠️  Bot health returned HTTP $STATUS (non-critical)"
          fi

      - name: Check response time
        run: |
          echo "🔍 Checking response time..."
          RESPONSE_TIME=$(curl -s -o /dev/null -w "%{time_total}" --max-time 10 ${{ env.APP_URL }}/health)
          echo "  Response time: ${RESPONSE_TIME}s"
          if (( $(echo "$RESPONSE_TIME > 5.0" | bc -l) )); then
            echo "⚠️  Response time is slow (${RESPONSE_TIME}s > 5s)"
          else
            echo "✅ Response time acceptable (${RESPONSE_TIME}s)"
          fi

      - name: Smoke test summary
        run: |
          echo ""
          echo "============================================"
          echo "  Smoke Tests Complete"
          echo "  App: ${{ env.APP_URL }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Deployed by: ${{ github.actor }}"
          echo "============================================"
