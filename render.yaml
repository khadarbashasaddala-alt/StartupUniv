# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Creates the web service and its Postgres database in one step.
# Secrets are marked `sync: false`, so Render prompts for them in the
# dashboard instead of keeping them in this file.

databases:
  - name: startupuniv-db
    databaseName: startupuniv
    user: startupuniv
    plan: free
    region: singapore

services:
  - type: web
    name: startupuniv
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # Wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: startupuniv-db
          property: connectionString

      # Render generates a random value on first deploy.
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_SECURE
        value: "true"
      - key: SESSION_MAX_AGE
        value: "86400000"

      # SSO and the chatbot are not reachable from Render; leave them off
      # so startup does not stall on discovery. Legacy login still works.
      - key: ENABLE_SSO
        value: "false"
      - key: ALLOW_LEGACY_LOGIN
        value: "true"
      - key: AUTO_MIGRATE_USERS
        value: "false"

      # Payment and GST settings carried over from .env.example.
      - key: DEFAULT_REGISTRATION_FEE
        value: "10000"
      - key: MAX_PAYMENT_AMOUNT
        value: "400000"
      - key: MIN_PAYMENT_AMOUNT
        value: "1"
      - key: PAYMENT_RETRY_LIMIT
        value: "2"
      - key: PAYMENT_RETRY_COOLDOWN
        value: "3600"
      - key: OFFER_EXPIRY_HOURS
        value: "24"
      - key: GST_RATE
        value: "18"
      - key: GST_INCLUSIVE
        value: "true"
      - key: COMPANY_NAME
        value: StartupUniv
      - key: COMPANY_ADDRESS
        value: India

      # Fill these in the Render dashboard. Deploy works without them,
      # but the matching feature stays dark until each one is set.
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
