# =============================================================================
# Promtail - Collects Docker container logs and ships to Loki
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # -------------------------------------------------------
  # Docker container logs
  # -------------------------------------------------------
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Parse Docker JSON log format
      - docker: {}

      # Extract container name from Docker labels
      - regex:
          expression: ".*containers/(?P<container_id>[^/]+)/.*"
          source: filename

      # Add useful labels
      - labels:
          container_id:

      # Filter: only keep logs from our app containers
      - match:
          selector: '{job="docker"}'
          stages:
            - docker: {}

      # Parse log levels from log content
      - regex:
          expression: '(?i)(?P<level>(ERROR|WARN|WARNING|INFO|DEBUG|CRITICAL))'
          source: output

      - labels:
          level:

      # Timestamp extraction
      - timestamp:
          source: time
          format: RFC3339Nano
