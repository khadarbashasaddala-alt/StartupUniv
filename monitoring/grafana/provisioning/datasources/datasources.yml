# =============================================================================
# Grafana Datasource Provisioning
# Auto-configures Prometheus and Loki on first boot
# =============================================================================

apiVersion: 1

datasources:
  # Prometheus - for metrics (CPU, RAM, request counts, latencies)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  # Loki - for logs (container stdout/stderr)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
