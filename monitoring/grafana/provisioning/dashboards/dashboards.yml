# =============================================================================
# Grafana Dashboard Provisioning
# Auto-loads dashboard JSON files on boot
# =============================================================================

apiVersion: 1

providers:
  - name: "StartupVarsity Dashboards"
    orgId: 1
    folder: "StartupVarsity"
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
