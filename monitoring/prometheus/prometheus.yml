# =============================================================================
# Prometheus Configuration
# Scrapes metrics from all services every 15 seconds
# =============================================================================

global:
  scrape_interval: 15s      # how often to scrape targets
  evaluation_interval: 15s  # how often to evaluate alert rules
  scrape_timeout: 10s

# Alert rules
rule_files:
  - "alert_rules.yml"

# Scrape targets
scrape_configs:
  # -------------------------------------------------------
  # Prometheus self-monitoring
  # -------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # -------------------------------------------------------
  # Node Exporter - Host machine metrics (CPU, RAM, Disk)
  # -------------------------------------------------------
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "host-machine"

  # -------------------------------------------------------
  # cAdvisor - Container metrics (per-container CPU, RAM, Network)
  # -------------------------------------------------------
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "docker-host"

  # -------------------------------------------------------
  # StartupVarsity Bot - FastAPI /metrics endpoint
  # -------------------------------------------------------
  - job_name: "startupvarsity-bot"
    metrics_path: /metrics
    static_configs:
      - targets: ["startupvarsity-bot:4001"]
        labels:
          service: "bot"
          environment: "dev"

  # -------------------------------------------------------
  # StartupVarsity Portal - Node.js web app (port 8080)
  # Note: add a /metrics endpoint to the portal to enable scraping
  # -------------------------------------------------------
  # - job_name: "startupvarsity-portal"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["startupvarsity-portal:8080"]
  #       labels:
  #         service: "portal"
  #         environment: "dev"
